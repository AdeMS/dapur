<!DOCTYPE html>
<html lang="id" class="h-100" data-bs-theme="auto">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Beranda - Dapur AdeMS</title>
        <link href="/asset/adems/img/favicon.ico" rel="shortcut icon" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <style>
            :root {
                --bs-dark: #00221c;
                --bs-dark-rgb: 0, 34, 28;
                --bs-link-color: #0a5700;
                --bs-link-color-rgb: 10, 87, 0;
                --bs-link-decoration: underline;
                --bs-link-hover-color: #009655;
                --bs-link-hover-color-rgb: 0, 150, 85;
                --bs-link-hover-decoration: none;
            }

            body {
                background-attachment: fixed;
                background-image: url('/asset/dapur/img/bg-image.png');
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
            }            

            a {
                color: rgba(var(--bs-link-color-rgb), var(--bs-link-opacity, 1));
                text-decoration: var(--bs-link-decoration);
            }
            a:hover {
                text-decoration: var(--bs-link-hover-decoration);
            }


            .jumbotron {
                padding: 3rem !important;
                margin-bottom: 1.5rem !important;
                background-color: rgba(var(--bs-light-rgb), 0.90 ) !important;
                border-radius: var(--bs-border-radius) !important;
            }

            .opacity-90 {
                opacity: 0.90;
            }
        </style>
    </head>
    <body class="d-flex flex-column h-100">
        <header>
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <div class="container-fluid">
                    <a class="navbar-brand py-0" href="https://github.com/adems/adems-dapur">
                        <img src="/asset/dapur/img/brand-logo.png" alt="Dapur AdeMS" height="40" />
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarCollapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/"><i class="bi bi-house-heart"></i> Beranda</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="flex-shrink-0 mt-5 pt-4">
            <div class="container">
                <div class="jumbotron">
                    <h1 class="mt-5">Selamat datang di Dapur AdeMS</h1>
                    <h5 class="mb-3">Tempat AdeMS untuk bermain dan belajar membuat website.</h5>
                    <p class="lead">
                        Selamat! Anda telah berhasil memasang
                        <a href="https://github.com/adems/adems-dapur" target="_blank">Dapur AdeMS</a>.
                    </p>
                </div>
            </div>
        </main>
        <footer class="footer mt-auto py-3 bg-body-tertiary">
            <div class="container">
                <span class="text-body-secondary">Hak cipta &copy;2025 <a href="https://www.adems.id/" class="fw-bold text-decoration-none">Tempat AdeMS</a> untuk bermain dan belajar.</span>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    </body>
</html>
